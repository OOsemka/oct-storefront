name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: pull requests from forks run with no secrets and cannot push.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - name: Type check
        run: yarn ts-check
      - name: Translation keys
        run: yarn check-i18n
      - name: Repository rules (PatternFly 6, no private data)
        run: yarn check-repo
      - name: Unit tests
        run: yarn test
      - name: Security report (non-blocking; see docs/security-model.md)
        run: yarn security-check
      - name: Build
        run: yarn build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: catalog-service/go.mod
          cache: false  # no dependencies (no go.sum)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
          command -v skopeo || (sudo apt-get update && sudo apt-get install -y skopeo)
      - name: Validate catalog (every listed image tag must be public)
        run: scripts/validate-catalog.sh
