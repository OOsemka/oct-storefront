# Community Tools extensions may only create or change Routes when approved in
# params.yaml (approvedRoutes).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: oct-route-approval
  labels:
    app.kubernetes.io/part-of: oct-storefront
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [route.openshift.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [routes]
  matchConditions:
    - name: from-community-tools
      # Objects the storefront installed (label) or requests from service
      # accounts in oct-* namespaces (objects extensions create at runtime).
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:oct-') ||
          (object != null && has(object.metadata.labels) && 'communitytools.io/extension' in object.metadata.labels) ||
          (oldObject != null && has(oldObject.metadata.labels) && 'communitytools.io/extension' in oldObject.metadata.labels)
  variables:
    - name: extId
      expression: >-
        (object != null && has(object.metadata.labels) && 'communitytools.io/extension' in object.metadata.labels) ? object.metadata.labels['communitytools.io/extension'] :
          (oldObject != null && has(oldObject.metadata.labels) && 'communitytools.io/extension' in oldObject.metadata.labels) ? oldObject.metadata.labels['communitytools.io/extension'] :
          request.userInfo.username.split(':')[2]
    - name: approved
      expression: >-
        has(params.data) && 'approvedRoutes' in params.data ?
          params.data['approvedRoutes'].split(',').map(s, s.trim()).filter(s, s != '') : []
  validations:
    - expression: "variables.approved.exists(a, a == '*' || a == variables.extId)"
      messageExpression: >-
        'Community Tools extension ' + variables.extId + ' is not approved to create Routes (Route ' +
        object.metadata.namespace + '/' + object.metadata.name + '); add it to approvedRoutes in oct-admission-params'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: oct-route-approval
  labels:
    app.kubernetes.io/part-of: oct-storefront
spec:
  policyName: oct-route-approval
  validationActions: [Warn, Audit]
  paramRef:
    name: oct-admission-params
    namespace: oct-storefront
    parameterNotFoundAction: Allow
