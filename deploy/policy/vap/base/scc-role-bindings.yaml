# Community Tools extensions may only bind an SCC role (system:openshift:scc:<scc>,
# which grants "use" of that SCC) when approved in params.yaml (approvedSCCBindings):
# "oct-shift-on-shift-virt:anyuid" approves one SCC for one extension,
# "oct-shift-on-shift-virt" any SCC for it, "*" everyone. Like the other
# settings-based rules it is skipped when oct-admission-params is missing (failing
# closed would block every RoleBinding on the cluster). Updates that keep the same
# subjects are not re-checked (roleRef can't change).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: oct-scc-role-bindings
  labels:
    app.kubernetes.io/part-of: oct-storefront
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [rolebindings, clusterrolebindings]
  matchConditions:
    - name: from-community-tools
      # Objects the storefront installed (label) or requests from service
      # accounts in oct-* namespaces (objects extensions create at runtime).
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:oct-') ||
          (object != null && has(object.metadata.labels) && 'communitytools.io/extension' in object.metadata.labels) ||
          (oldObject != null && has(oldObject.metadata.labels) && 'communitytools.io/extension' in oldObject.metadata.labels)
    - name: binds-scc-role
      expression: "object.roleRef.kind == 'ClusterRole' && object.roleRef.name.startsWith('system:openshift:scc:')"
  variables:
    # A request from an oct-* ServiceAccount is that extension, whatever its labels say
    # (a label must not borrow another extension's approval). Otherwise the label.
    - name: extId
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:oct-') ? request.userInfo.username.split(':')[2] :
          (object != null && has(object.metadata.labels) && 'communitytools.io/extension' in object.metadata.labels) ? object.metadata.labels['communitytools.io/extension'] :
          (oldObject != null && has(oldObject.metadata.labels) && 'communitytools.io/extension' in oldObject.metadata.labels) ? oldObject.metadata.labels['communitytools.io/extension'] :
          'unknown'
    - name: scc
      expression: "object.roleRef.name.substring(size('system:openshift:scc:'))"
    - name: approved
      expression: >-
        has(params.data) && 'approvedSCCBindings' in params.data ?
          params.data['approvedSCCBindings'].split(',').map(s, s.trim()).filter(s, s != '') : []
  validations:
    - expression: >-
        (request.operation == 'UPDATE' &&
          (has(object.subjects) ? object.subjects : []) == (has(oldObject.subjects) ? oldObject.subjects : [])) ||
        variables.approved.exists(a, a == '*' || a == variables.extId || a == variables.extId + ':' + variables.scc)
      messageExpression: >-
        'Community Tools extension ' + variables.extId + ' is not approved to bind the ' + object.roleRef.name +
        ' ClusterRole (' + object.kind + ' ' + object.metadata.name + '); add ' + variables.extId + ':' + variables.scc +
        ' to approvedSCCBindings in oct-admission-params'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: oct-scc-role-bindings
  labels:
    app.kubernetes.io/part-of: oct-storefront
spec:
  policyName: oct-scc-role-bindings
  validationActions: [Warn, Audit]
  paramRef:
    name: oct-admission-params
    namespace: oct-storefront
    parameterNotFoundAction: Allow
