apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-example-tool
spec:
  displayName: Example Tool
  description: One or two sentences. Do not claim Red Hat support.
  category: network
  source: community
  git: https://github.com/example/oct-example-tool
  consolePlugin: oct-example-tool
  # Must match a path in this extension's console-extensions.json.
  href: /example-tool
  # Bundled storefront SVG: add src/assets/tiles/oct-<name>.svg, register in
  # src/utils/tile-icons.ts, and copy the same spec.icon into deploy/install.yaml.
  icon: tiles/oct-example-tool.svg
  defaultChannel: stable
  channels:
    stable: {}
  # Two axes in the catalog: versions[].version (semver) vs openshift (cluster minor).
  # Image tags MUST be <semver>-ocp<major.minor> (e.g. :1.1.0-ocp4.22), not :1.1.0 or :4.22.
  # Always publish both -ocp4.21 and -ocp4.22 (same digest if bits match).
  # Never list a (version, OCP minor) row unless that exact public tag exists.
  # Community Add has no pull secret. Missing tags → Add can still succeed; Open 404s.
  versions:
    - version: "1.0.0"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/example/oct-example-tool:1.0.0-ocp4.21
      gitRef: v1.0.0
    - version: "1.0.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/example/oct-example-tool:1.0.0-ocp4.22
      gitRef: v1.0.0
    - version: "1.1.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/example/oct-example-tool:1.1.0-ocp4.22
      gitRef: v1.1.0
  minOpenShift: "4.21"
