apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-example-tool
spec:
  displayName: Example Tool
  description: One or two sentences. Do not claim Red Hat support.
  category: network
  source: community
  git: https://github.com/example/oct-example-tool
  consolePlugin: oct-example-tool
  # Must match a path in this extension's console-extensions.json.
  href: /example-tool
  defaultChannel: stable
  channels:
    stable: {}
  # Two axes: versions[].version (semver, image :1.1.0) vs openshift (cluster minor).
  # Publish the semver tag the catalog lists. Do not list :1.1.0 if only :4.22 exists.
  # Every versions[].image must be a public registry repo (e.g. public Quay)
  # AND the tag must exist (anonymous pull). Community Add has no pull secret.
  # Private or missing tags → Add can still succeed; Open 404s (ImagePullBackOff).
  versions:
    - version: "1.0.0"
      channel: stable
      openshift: ["4.21", "4.22"]
      image: quay.io/example/oct-example-tool:1.0.0
      gitRef: v1.0.0
    - version: "1.1.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/example/oct-example-tool:1.1.0
      gitRef: v1.1.0
  minOpenShift: "4.21"
