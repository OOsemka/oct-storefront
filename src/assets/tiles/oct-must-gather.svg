<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Must-Gather. Original art: cluster data sheets dropping into an open
       archive box, with a download arrow (gather, pack, download). -->
  <circle cx="32" cy="32" r="30" fill="#F2F5FA" stroke="#B4C2D3" stroke-width="1.75"/>
  <!-- Data sheets going into the box -->
  <g transform="rotate(-10 24 22)">
    <rect x="17" y="10" width="14" height="18" rx="1.6" fill="#FFFFFF" stroke="#7F8FA3" stroke-width="1.3"/>
    <path d="M20 15 H28 M20 18.5 H28 M20 22 H25" stroke="#4F8FD8" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g transform="rotate(8 38 20)">
    <rect x="31" y="9" width="14" height="18" rx="1.6" fill="#FFFFFF" stroke="#7F8FA3" stroke-width="1.3"/>
    <path d="M34 14 H42 M34 17.5 H42 M34 21 H39" stroke="#E0702E" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Box back flaps -->
  <path d="M15 31 L11 25 L23 25 L26 31 Z" fill="#C9934F" stroke="#8E6230" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M49 31 L53 25 L41 25 L38 31 Z" fill="#C9934F" stroke="#8E6230" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Box body -->
  <path d="M14 30 H50 L47.5 52 C47.3 53.4 46.2 54 45 54 H19 C17.8 54 16.7 53.4 16.5 52 Z" fill="#E2AE68" stroke="#8E6230" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M14 30 H50" stroke="#8E6230" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Download arrow on the box -->
  <circle cx="32" cy="42" r="7.5" fill="#2F6FBF"/>
  <path d="M32 37.5 V45.5 M28.6 42.4 L32 45.8 L35.4 42.4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
