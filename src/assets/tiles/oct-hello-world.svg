<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" fill="none">
  <!-- Waving hand. Original art: an open hand built from rounded shapes, tilted
       mid-wave, with motion arcs. The hand is drawn twice (outline layer, then
       fill layer) so the pieces share one clean silhouette. -->
  <defs>
    <g id="hw-hand">
      <rect x="19" y="15" width="7" height="22" rx="3.5"/>
      <rect x="26.5" y="11" width="7" height="26" rx="3.5"/>
      <rect x="34" y="13" width="7" height="24" rx="3.5"/>
      <rect x="41.5" y="18" width="6.5" height="19" rx="3.25"/>
      <rect x="15" y="30" width="7.5" height="18" rx="3.75" transform="rotate(-32 18.75 46)"/>
      <rect x="18.5" y="28" width="29.5" height="23" rx="10"/>
    </g>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#F3F7FB" stroke="#B7C6D4" stroke-width="1.75"/>
  <!-- Motion arcs -->
  <path d="M12 17 A14 14 0 0 1 20 8.5" stroke="#8A96A0" stroke-width="2" stroke-linecap="round"/>
  <path d="M16.5 19.5 A9 9 0 0 1 21.5 13.5" stroke="#8A96A0" stroke-width="2" stroke-linecap="round"/>
  <path d="M56 33 A15 15 0 0 0 54 20" stroke="#8A96A0" stroke-width="2" stroke-linecap="round"/>
  <path d="M51 32 A10 10 0 0 0 49.5 24" stroke="#8A96A0" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(32 33) scale(0.86) translate(-32 -33) rotate(14 33 40)">
    <!-- Outline layer -->
    <use xlink:href="#hw-hand" href="#hw-hand" fill="#D9961A" stroke="#D9961A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Fill layer -->
    <use xlink:href="#hw-hand" href="#hw-hand" fill="#FFCA58"/>
    <!-- Finger gaps -->
    <path d="M26.25 22 V31" stroke="#D9961A" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M33.75 20 V31" stroke="#D9961A" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M41.25 24 V31" stroke="#D9961A" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Palm crease and highlight -->
    <path d="M23 41 C27 44 31 44.5 35 43" stroke="#E8AE34" stroke-width="1.1" stroke-linecap="round"/>
    <rect x="28.5" y="13.5" width="2" height="7" rx="1" fill="#FFE29E"/>
  </g>
</svg>
