<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Original network wedding: interlocking ethernet rings with RJ-45 charms. No 007 marks. -->
  <circle cx="32" cy="32" r="30" fill="#F3F7FB" stroke="#B7C6D4" stroke-width="1.75"/>
  <!-- Left ring (blue cable) -->
  <circle cx="24" cy="31" r="13.2" fill="none" stroke="#0A6CBD" stroke-width="4.6"/>
  <!-- Right ring (amber cable) -->
  <circle cx="40" cy="31" r="13.2" fill="none" stroke="#C4610A" stroke-width="4.6"/>
  <!-- Blue overpass so the rings interlock -->
  <path
    d="M24 17.8 A13.2 13.2 0 0 1 37.2 31"
    fill="none"
    stroke="#0A6CBD"
    stroke-width="4.6"
    stroke-linecap="butt"
  />
  <!-- Left RJ-45 charm -->
  <g transform="translate(16.2,41.2) rotate(-28)">
    <rect x="0" y="0" width="11.2" height="8.2" rx="1.2" fill="#E4E9EE" stroke="#6A7680" stroke-width="0.85"/>
    <rect x="1.4" y="5.6" width="8.4" height="3.4" rx="0.4" fill="#C9D2DA"/>
    <rect x="2" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <rect x="3.7" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <rect x="5.4" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <rect x="7.1" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <path d="M3.2 0 L3.2 -2.1 H8 L8 0" fill="#0A6CBD"/>
  </g>
  <!-- Right RJ-45 charm -->
  <g transform="translate(37.4,41.5) rotate(28)">
    <rect x="0" y="0" width="11.2" height="8.2" rx="1.2" fill="#E4E9EE" stroke="#6A7680" stroke-width="0.85"/>
    <rect x="1.4" y="5.6" width="8.4" height="3.4" rx="0.4" fill="#C9D2DA"/>
    <rect x="2" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <rect x="3.7" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <rect x="5.4" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <rect x="7.1" y="6.2" width="1.15" height="2.2" fill="#E8B923"/>
    <path d="M3.2 0 L3.2 -2.1 H8 L8 0" fill="#C4610A"/>
  </g>
</svg>
