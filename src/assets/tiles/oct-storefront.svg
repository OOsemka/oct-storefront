<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Inviting storefront / shop icon. Original art, not a trademark. -->
  <!-- Building body -->
  <rect x="10" y="26" width="44" height="32" rx="2" fill="#F5F0E8" stroke="#8B7B6A" stroke-width="1.2"/>
  <!-- Awning / canopy -->
  <path
    d="M6 26 L58 26 L56 18 C55 15 52 13 49 13 L15 13 C12 13 9 15 8 18 Z"
    fill="#E05050"
    stroke="#B03030"
    stroke-width="1.1"
    stroke-linejoin="round"
  />
  <!-- Awning scallops -->
  <path
    d="M8 26 Q14 30 20 26 Q26 30 32 26 Q38 30 44 26 Q50 30 56 26"
    fill="none"
    stroke="#C04040"
    stroke-width="1.4"
    stroke-linecap="round"
  />
  <!-- Door (open, welcoming) -->
  <rect x="25" y="38" width="14" height="20" rx="1.5" fill="#6A4420" stroke="#4A2E10" stroke-width="1"/>
  <!-- Door window -->
  <rect x="28" y="41" width="8" height="7" rx="1" fill="#B8E0F0" stroke="#4A2E10" stroke-width="0.6"/>
  <!-- Door handle -->
  <circle cx="37" cy="50" r="1.2" fill="#D4A84A" stroke="#A07830" stroke-width="0.6"/>
  <!-- Left window -->
  <rect x="13" y="32" width="9" height="9" rx="1.2" fill="#B8E0F0" stroke="#8B7B6A" stroke-width="0.9"/>
  <line x1="17.5" y1="32" x2="17.5" y2="41" stroke="#8B7B6A" stroke-width="0.6"/>
  <line x1="13" y1="36.5" x2="22" y2="36.5" stroke="#8B7B6A" stroke-width="0.6"/>
  <!-- Right window -->
  <rect x="42" y="32" width="9" height="9" rx="1.2" fill="#B8E0F0" stroke="#8B7B6A" stroke-width="0.9"/>
  <line x1="46.5" y1="32" x2="46.5" y2="41" stroke="#8B7B6A" stroke-width="0.6"/>
  <line x1="42" y1="36.5" x2="51" y2="36.5" stroke="#8B7B6A" stroke-width="0.6"/>
  <!-- Sign above door -->
  <rect x="20" y="7" width="24" height="6" rx="1.5" fill="#F0C14A" stroke="#C49222" stroke-width="0.8"/>
  <!-- Welcome mat -->
  <rect x="26" y="56" width="12" height="3" rx="1" fill="#7B9B60" stroke="#5A7840" stroke-width="0.6"/>
</svg>
