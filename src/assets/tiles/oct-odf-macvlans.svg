<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Original storage octopus (a nod to Ceph, the cephalopod): a disk-stack body
       whose tentacles are network lanes, blue = public network, amber = cluster
       network, each ending in a plug. -->
  <circle cx="32" cy="32" r="30" fill="#F3F7FB" stroke="#B7C6D4" stroke-width="1.75"/>
  <!-- Tentacles: public (blue) -->
  <path d="M25 33 C20 38 13 37 11 43 C9.5 47.5 13 50 16 48" stroke="#0A6CBD" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M29 34 C28 41 22 44 24 50" stroke="#0A6CBD" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Tentacles: cluster (amber) -->
  <path d="M35 34 C36 41 42 44 40 50" stroke="#C4610A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M39 33 C44 38 51 37 53 43 C54.5 47.5 51 50 48 48" stroke="#C4610A" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Plugs at the tentacle tips -->
  <rect x="13.4" y="46" width="5" height="4" rx="0.8" fill="#E4E9EE" stroke="#6A7680" stroke-width="0.8"/>
  <rect x="21.5" y="49" width="5" height="4" rx="0.8" fill="#E4E9EE" stroke="#6A7680" stroke-width="0.8"/>
  <rect x="37.5" y="49" width="5" height="4" rx="0.8" fill="#E4E9EE" stroke="#6A7680" stroke-width="0.8"/>
  <rect x="45.6" y="46" width="5" height="4" rx="0.8" fill="#E4E9EE" stroke="#6A7680" stroke-width="0.8"/>
  <rect x="14.6" y="48.4" width="2.6" height="1.2" fill="#E8B923"/>
  <rect x="22.7" y="51.4" width="2.6" height="1.2" fill="#E8B923"/>
  <rect x="38.7" y="51.4" width="2.6" height="1.2" fill="#E8B923"/>
  <rect x="46.8" y="48.4" width="2.6" height="1.2" fill="#E8B923"/>
  <!-- Body: a disk stack -->
  <path d="M19 15 V31 C19 34.3 24.8 37 32 37 C39.2 37 45 34.3 45 31 V15 Z" fill="#5E40BE"/>
  <path d="M19 21.5 C19 24.8 24.8 27.5 32 27.5 C39.2 27.5 45 24.8 45 21.5" stroke="#8476D1" stroke-width="1.2"/>
  <path d="M19 27.5 C19 30.8 24.8 33.5 32 33.5 C39.2 33.5 45 30.8 45 27.5" stroke="#8476D1" stroke-width="1.2"/>
  <ellipse cx="32" cy="15" rx="13" ry="5" fill="#8476D1"/>
  <ellipse cx="32" cy="15" rx="9" ry="3" fill="#A79EE0"/>
  <!-- Eyes -->
  <circle cx="27" cy="23.5" r="3" fill="#fff"/>
  <circle cx="37" cy="23.5" r="3" fill="#fff"/>
  <circle cx="27.8" cy="24" r="1.4" fill="#1F1F1F"/>
  <circle cx="37.8" cy="24" r="1.4" fill="#1F1F1F"/>
  <!-- Activity LED -->
  <circle cx="41" cy="31" r="1" fill="#63BC4B"/>
</svg>
