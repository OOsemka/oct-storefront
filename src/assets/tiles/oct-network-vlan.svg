<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- VLAN: stacked network lanes with tag labels, representing segmented traffic. -->
  <circle cx="32" cy="32" r="30" fill="#F3F7FB" stroke="#B7C6D4" stroke-width="1.75"/>
  <!-- Lane 1 (top, blue) -->
  <rect x="12" y="14" width="40" height="7" rx="2" fill="#0A6CBD" opacity="0.85"/>
  <rect x="14" y="16" width="12" height="3" rx="1" fill="#fff" opacity="0.9"/>
  <text x="16" y="18.6" font-family="sans-serif" font-size="3" fill="#0A6CBD" font-weight="bold">VLAN 10</text>
  <!-- Data dots lane 1 -->
  <circle cx="34" cy="17.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="38" cy="17.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="42" cy="17.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="46" cy="17.5" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- Lane 2 (middle, amber) -->
  <rect x="12" y="25" width="40" height="7" rx="2" fill="#C4610A" opacity="0.85"/>
  <rect x="14" y="27" width="12" height="3" rx="1" fill="#fff" opacity="0.9"/>
  <text x="16" y="29.6" font-family="sans-serif" font-size="3" fill="#C4610A" font-weight="bold">VLAN 20</text>
  <!-- Data dots lane 2 -->
  <circle cx="34" cy="28.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="38" cy="28.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="42" cy="28.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="46" cy="28.5" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- Lane 3 (bottom, teal) -->
  <rect x="12" y="36" width="40" height="7" rx="2" fill="#009596" opacity="0.85"/>
  <rect x="14" y="38" width="12" height="3" rx="1" fill="#fff" opacity="0.9"/>
  <text x="16" y="40.6" font-family="sans-serif" font-size="3" fill="#009596" font-weight="bold">VLAN 30</text>
  <!-- Data dots lane 3 -->
  <circle cx="34" cy="39.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="38" cy="39.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="42" cy="39.5" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="46" cy="39.5" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- Vertical tag markers (left side dividers) -->
  <line x1="10" y1="14" x2="10" y2="43" stroke="#6A7680" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="10" cy="17.5" r="2" fill="#0A6CBD"/>
  <circle cx="10" cy="28.5" r="2" fill="#C4610A"/>
  <circle cx="10" cy="39.5" r="2" fill="#009596"/>
  <!-- Bottom caption area -->
  <text x="32" y="52" font-family="sans-serif" font-size="4.5" fill="#6A7680" text-anchor="middle" font-weight="bold">802.1Q</text>
</svg>
