apiVersion: v1
kind: Namespace
metadata:
  name: oct-network-bridge
  labels:
    app.kubernetes.io/part-of: oct-network-bridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oct-network-bridge
  namespace: oct-network-bridge
  labels:
    app: oct-network-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oct-network-bridge
  template:
    metadata:
      labels:
        app: oct-network-bridge
    spec:
      containers:
        - name: plugin
          image: quay.io/cjanisze/oct-network-bridge:1.0.0-ocp4.22
          ports:
            - containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: plugin-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
      volumes:
        - name: plugin-serving-cert
          secret:
            secretName: plugin-serving-cert
            defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: oct-network-bridge
  namespace: oct-network-bridge
  labels:
    app: oct-network-bridge
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: plugin-serving-cert
spec:
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    app: oct-network-bridge
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: oct-network-bridge
spec:
  displayName: Network Bridge (Community Tools)
  backend:
    type: Service
    service:
      name: oct-network-bridge
      namespace: oct-network-bridge
      port: 9443
      basePath: /
