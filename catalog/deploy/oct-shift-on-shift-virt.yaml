apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oct-shift-on-shift-virt-orchestrator
  labels:
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oct-shift-on-shift-virt-orchestrator
subjects:
- kind: ServiceAccount
  name: sos-orchestrator
  namespace: oct-shift-on-shift-virt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oct-shift-on-shift-virt
  namespace: oct-shift-on-shift-virt
  labels:
    app: oct-shift-on-shift-virt
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oct-shift-on-shift-virt
  template:
    metadata:
      labels:
        app: oct-shift-on-shift-virt
    spec:
      containers:
      - name: plugin
        image: quay.io/cjanisze/oct-shift-on-shift-virt:0.2.2-ocp4.22
        ports:
        - containerPort: 9443
          protocol: TCP
        volumeMounts:
        - name: plugin-serving-cert
          readOnly: true
          mountPath: /var/serving-cert
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        imagePullPolicy: Always
      volumes:
      - name: plugin-serving-cert
        secret:
          secretName: plugin-serving-cert
          defaultMode: 420
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: oct-shift-on-shift-virt
  namespace: oct-shift-on-shift-virt
  labels:
    app: oct-shift-on-shift-virt
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: plugin-serving-cert
spec:
  ports:
  - name: 9443-tcp
    protocol: TCP
    port: 9443
    targetPort: 9443
  selector:
    app: oct-shift-on-shift-virt
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sos-orchestrator
  namespace: oct-shift-on-shift-virt
  labels:
    app: sos-orchestrator
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sos-orchestrator
  template:
    metadata:
      labels:
        app: sos-orchestrator
    spec:
      serviceAccountName: sos-orchestrator
      containers:
      - name: orchestrator
        image: quay.io/cjanisze/oct-shift-on-shift-virt-orchestrator:0.2.2-ocp4.22
        imagePullPolicy: Always
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: serving-cert
          readOnly: true
          mountPath: /var/serving-cert
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        env:
        - name: EDGE_PROXY_VLAN_IP
          value: ""
        - name: EDGE_PROXY_NAD
          value: ""
        - name: DNS_MODE
          value: vm
      volumes:
      - name: serving-cert
        secret:
          secretName: sos-orchestrator-serving-cert
          defaultMode: 420
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sos-orchestrator
  namespace: oct-shift-on-shift-virt
  labels:
    app: sos-orchestrator
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: sos-orchestrator-serving-cert
spec:
  ports:
  - name: https
    protocol: TCP
    port: 8443
    targetPort: 8443
  selector:
    app: sos-orchestrator
  type: ClusterIP
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: oct-shift-on-shift-virt
spec:
  displayName: Shift-on-Shift Virt (Community Tools)
  backend:
    type: Service
    service:
      name: oct-shift-on-shift-virt
      namespace: oct-shift-on-shift-virt
      port: 9443
      basePath: /
  proxy:
  - alias: orchestrator
    endpoint:
      type: Service
      service:
        name: sos-orchestrator
        namespace: oct-shift-on-shift-virt
        port: 8443
