apiVersion: v1
kind: Namespace
metadata:
  name: oct-storage-bench
  labels:
    app.kubernetes.io/part-of: oct-storage-bench
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-runner
  namespace: oct-storage-bench
  labels:
    app.kubernetes.io/part-of: oct-storage-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oct-storage-bench
  labels:
    app.kubernetes.io/part-of: oct-storage-bench
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["cephblockpools", "cephclusters"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["ocs.openshift.io"]
    resources: ["storageclusters"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oct-storage-bench
  labels:
    app.kubernetes.io/part-of: oct-storage-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oct-storage-bench
subjects:
  - kind: ServiceAccount
    name: benchmark-runner
    namespace: oct-storage-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oct-storage-bench-rados
  namespace: openshift-storage
  labels:
    app.kubernetes.io/part-of: oct-storage-bench
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oct-storage-bench-rados
  namespace: openshift-storage
  labels:
    app.kubernetes.io/part-of: oct-storage-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oct-storage-bench-rados
subjects:
  - kind: ServiceAccount
    name: benchmark-runner
    namespace: oct-storage-bench
---
apiVersion: v1
kind: Service
metadata:
  name: oct-storage-bench
  namespace: oct-storage-bench
  labels:
    app: oct-storage-bench
    app.kubernetes.io/part-of: oct-storage-bench
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: plugin-serving-cert
spec:
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    app: oct-storage-bench
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-runner
  namespace: oct-storage-bench
  labels:
    app: benchmark-runner
    app.kubernetes.io/part-of: oct-storage-bench
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: benchmark-runner-serving-cert
spec:
  ports:
    - name: 8443-tcp
      protocol: TCP
      port: 8443
      targetPort: 8443
  selector:
    app: benchmark-runner
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oct-storage-bench
  namespace: oct-storage-bench
  labels:
    app: oct-storage-bench
    app.kubernetes.io/part-of: oct-storage-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oct-storage-bench
  template:
    metadata:
      labels:
        app: oct-storage-bench
    spec:
      containers:
        - name: plugin
          image: quay.io/cjanisze/oct-storage-bench:0.1.1-ocp4.22
          ports:
            - containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: plugin-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: plugin-serving-cert
          secret:
            secretName: plugin-serving-cert
            defaultMode: 420
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-runner
  namespace: oct-storage-bench
  labels:
    app: benchmark-runner
    app.kubernetes.io/part-of: oct-storage-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-runner
  template:
    metadata:
      labels:
        app: benchmark-runner
    spec:
      serviceAccountName: benchmark-runner
      containers:
        - name: benchmark-runner
          image: quay.io/cjanisze/oct-storage-bench-runner:0.1.1-ocp4.22
          ports:
            - containerPort: 8443
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: runner-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: runner-serving-cert
          secret:
            secretName: benchmark-runner-serving-cert
            defaultMode: 420
      restartPolicy: Always
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: oct-storage-bench
spec:
  displayName: Storage Bench (Community Tools)
  backend:
    type: Service
    service:
      name: oct-storage-bench
      namespace: oct-storage-bench
      port: 9443
      basePath: /
  proxy:
    - alias: benchmark-runner
      endpoint:
        type: Service
        service:
          name: benchmark-runner
          namespace: oct-storage-bench
          port: 8443
