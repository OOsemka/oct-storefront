apiVersion: v1
kind: Namespace
metadata:
  name: oct-baremetal
  labels:
    app.kubernetes.io/part-of: oct-baremetal
---
apiVersion: v1
kind: Service
metadata:
  name: oct-baremetal
  namespace: oct-baremetal
  labels:
    app: oct-baremetal
    app.kubernetes.io/part-of: oct-baremetal
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: plugin-serving-cert
spec:
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    app: oct-baremetal
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oct-baremetal
  namespace: oct-baremetal
  labels:
    app: oct-baremetal
    app.kubernetes.io/part-of: oct-baremetal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oct-baremetal
  template:
    metadata:
      labels:
        app: oct-baremetal
    spec:
      # The plugin only serves static files and never calls the API.
      automountServiceAccountToken: false
      containers:
        - name: plugin
          image: quay.io/openshift-community-tools/oct-baremetal:0.1.2-ocp4.22
          ports:
            - containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: plugin-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: plugin-serving-cert
          secret:
            secretName: plugin-serving-cert
            defaultMode: 420
      restartPolicy: Always
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: oct-baremetal
spec:
  displayName: Bare Metal Hosts
  backend:
    type: Service
    service:
      name: oct-baremetal
      namespace: oct-baremetal
      port: 9443
      basePath: /
  proxy:
    - alias: bmh-proxy
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: oct-baremetal
          namespace: oct-baremetal
          port: 9443
    - alias: discovery-service
      authorization: UserToken
      endpoint:
        type: Service
        service:
          name: discovery-service
          namespace: oct-baremetal
          port: 8443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-service
  namespace: oct-baremetal
  labels:
    app: discovery-service
---
# ClusterRole: the image-cache pipeline needs cross-namespace access to
# DataSources, PVCs, VolumeSnapshots, VMExports, and Secrets in the
# openshift-virtualization-os-images namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: discovery-service-image-cache
  labels:
    app: discovery-service
    app.kubernetes.io/part-of: oct-baremetal
rules:
  # Read DataSources to resolve backing PVCs/snapshots
  - apiGroups:
      - cdi.kubevirt.io
    resources:
      - datasources
    verbs:
      - get
      - list
  # Read VolumeSnapshots (to determine restore size for temp PVCs)
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
      - volumesnapshotclasses
    verbs:
      - get
      - list
  # List StorageClasses (image-cache / snapshot restore uses the Add class)
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
  # Create/delete VirtualMachineExports (temporary, for data extraction)
  - apiGroups:
      - export.kubevirt.io
    resources:
      - virtualmachineexports
    verbs:
      - get
      - list
      - create
      - delete
  # Read export token secrets
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  # Create/delete temporary PVCs (for snapshot-backed DataSources)
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - create
      - delete
  # Read Routes to determine the external URL for the image cache
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: discovery-service-image-cache
  labels:
    app: discovery-service
    app.kubernetes.io/part-of: oct-baremetal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: discovery-service-image-cache
subjects:
  - kind: ServiceAccount
    name: discovery-service
    namespace: oct-baremetal
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: oct-baremetal
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: discovery-service-tls
  labels:
    app: discovery-service
spec:
  type: ClusterIP
  selector:
    app: discovery-service
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-cache
  namespace: oct-baremetal
  labels:
    app: discovery-service
    app.kubernetes.io/part-of: oct-baremetal
  annotations:
    description: >-
      Shared cache for bare-metal OS images served over HTTP. Sized for
      2-3 raw disk images. Never hardcode a lab StorageClass. Omit
      storageClassName (or leave Add on cluster default) unless you need a
      specific class. Optional annotation communitytools.io/storage-class
      selects a class when Add has no UI override.
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: image-cache
  namespace: oct-baremetal
  labels:
    app: discovery-service
    app.kubernetes.io/part-of: oct-baremetal
spec:
  # Only the image files are published (Ironic fetches them without a user).
  path: /api/v1/image-cache/images/
  to:
    kind: Service
    name: discovery-service
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: oct-baremetal
  labels:
    app: discovery-service
spec:
  replicas: 1
  # RWO image-cache cannot attach to two nodes; RollingUpdate deadlocks.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: quay.io/openshift-community-tools/oct-baremetal-discovery:1.1.1-ocp4.22
          env:
            # backend-security-kit: audit until a cluster admin enables enforce
            # (backends.oct-baremetal.authMode in the cluster policy).
            - name: AUTH_MODE
              value: audit
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /var/run/secrets/tls
              readOnly: true
            - name: image-cache
              mountPath: /data/image-cache
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          secret:
            secretName: discovery-service-tls
        - name: image-cache
          persistentVolumeClaim:
            claimName: image-cache
      serviceAccountName: discovery-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oct-baremetal
  namespace: oct-baremetal
  labels:
    app.kubernetes.io/part-of: oct-baremetal
spec:
  # The console plugin's static files: only the console loads them.
  podSelector:
    matchLabels:
      app: oct-baremetal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-console
      ports:
        - { protocol: TCP, port: 9443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: discovery-service
  namespace: oct-baremetal
  labels:
    app.kubernetes.io/part-of: oct-baremetal
spec:
  # The API (8443) only through the console proxy; the image port (8080) only through
  # the router (the image-cache Route, used by Ironic). Kubelet probes are not affected.
  podSelector:
    matchLabels:
      app: discovery-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-console
      ports:
        - { protocol: TCP, port: 8443 }
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - { protocol: TCP, port: 8080 }
