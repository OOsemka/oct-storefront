---
apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-must-gather
spec:
  displayName: Must-Gather
  description: >-
    Run oc adm must-gather on this cluster from the console: full,
    networking, storage, virtualization, serverless, GitOps or Service Mesh,
    optionally with audit logs and must-gather-clean obfuscation. Downloads
    the archive with Red Hat's recommended file name, ready to attach to a
    support case. Runs with your own credentials (cluster-admin). Community
    project, not officially supported by Red Hat.
  category: management
  source: community
  git: https://github.com/dwaiting/oct-must-gather
  consolePlugin: oct-must-gather
  href: /community-tools/management/must-gather
  icon: tiles/oct-must-gather.svg
  # The bundle adds the runner Deployment (oc + must-gather-clean), its
  # Service and ServiceAccount (no RBAC), and the ConsolePlugin proxy with
  # UserToken authorization. The runner image is built per OCP minor; the
  # bundle uses the -ocp4.22 runner (oc 4.22 supports 4.21 clusters).
  security:
    schema: 1
    level: namespaced
    summary: Runs oc adm must-gather with your own credentials (cluster-admin needed for a full gather) and lets you download the archive. The runner's ServiceAccount has no RBAC; jobs and archives are visible only to the user who started them and expire after 4 hours.
    backend:
      services: [must-gather-runner]
      auth: tokenreview
      publicPaths: []
    network: { ingress: console-only, networkPolicy: false, routes: [], egress: [] }
    privileged:
      scc: []
      hostAccess: []
      runtimeCreates:
        - { kind: Namespace, name: "openshift-must-gather-* (temporary)", cleanup: Removed by oc adm must-gather when the gather ends., why: "oc adm must-gather runs its gather pod (privileged, on a node) in a temporary namespace; created with your permissions, not the runner's." }
    secrets: { access: none }
  defaultChannel: stable
  channels:
    stable: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  versions:
    - version: "0.1.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-must-gather:0.1.1-ocp4.21
      gitRef: v0.1.1
    - version: "0.1.1"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-must-gather:0.1.1-ocp4.22
      gitRef: v0.1.1
