apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-storefront
spec:
  displayName: Community Tools Storefront
  description: >-
    The OCT catalog and extension manager. This tile shows when a
    storefront update is available. Update fetches the latest install
    manifest from GitHub and applies it.
  category: management
  source: community
  git: https://github.com/openshift-community-tools/oct-storefront
  consolePlugin: oct-storefront
  href: /community-tools/management/storefront
  icon: tiles/oct-storefront.svg
  defaultChannel: stable
  channels:
    stable: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: cluster-write
    summary: Installs catalog tools with the signed-in user's own credentials after a review screen. Its own permissions are limited to enabling its plugin and reading the cluster policy.
    backend:
      services: [catalog-service]
      auth: ssar
      authModeDefault: audit
      publicPaths: []
    network:
      ingress: console-only
      networkPolicy: false
      routes: []
      egress:
        - { host: api.octools.net, why: Public catalog, download counts and ratings (telemetry can be turned off in the cluster policy). }
    rbac:
      rules:
        - { apiGroups: [operator.openshift.io], resources: [consoles], resourceNames: [cluster], verbs: [get, patch], why: The one-time install Job adds the storefront to the console's plugin list. }
        - { apiGroups: [""], resources: [configmaps], resourceNames: [community-tools-policy], verbs: [get], why: "Every user (and extension backend) can read the cluster policy; nothing else." }
    secrets: { access: none }
