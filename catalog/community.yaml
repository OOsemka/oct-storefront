apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-baremetal
spec:
  displayName: Bare Metal Hosts
  description: >-
    Inventory Metal3 BareMetalHost nodes, register hosts from BMC Redfish, and
    deploy golden images. Register and Deploy open from the inventory.
  category: compute
  source: community
  git: https://github.com/openshift-community-tools/oct-baremetal
  consolePlugin: oct-baremetal
  href: /baremetal/nodes
  # Bundled storefront SVG (src/assets/tiles/). Not a URL.
  icon: tiles/oct-baremetal.svg
  # Add checks Provisioning/provisioning-configuration spec.watchAllNamespaces
  # and can patch true with the user's console credentials (recommended switch).
  # Optional: spec.storageClassName pre-selects Add's StorageClass dropdown
  # for PVC image-cache (100Gi). Omit to use the cluster default.
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: privileged
    summary: Inventory for Metal3 BareMetalHosts. Registers hosts with the signed-in user's own credentials and serves golden images to Ironic from a cache; only the image files are published by a Route.
    backend:
      services: [discovery-service]
      auth: ssar
      authModeDefault: audit
      publicPaths: [/api/v1/image-cache/images/]
    network:
      ingress: route
      networkPolicy: true
      routes:
        - { name: image-cache, paths: [/api/v1/image-cache/images/], why: "Ironic downloads golden images over plain HTTP without a user; only the image files are published, the API stays behind the console proxy." }
      egress:
        - { host: "BMC addresses entered in the register wizard", why: "Discovery reads hardware details from the BMC (Redfish); only users allowed to create BareMetalHosts in the target namespace can use it." }
    rbac:
      rules:
        - { apiGroups: [cdi.kubevirt.io], resources: [datasources], verbs: [get, list], why: Find the golden image to export. }
        - { apiGroups: [snapshot.storage.k8s.io], resources: [volumesnapshots, volumesnapshotclasses], verbs: [get, list], why: Find the snapshot behind a golden image. }
        - { apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list], why: Pick a StorageClass for exports. }
        - { apiGroups: [export.kubevirt.io], resources: [virtualmachineexports], verbs: [get, list, create, delete], why: Export golden images into the image cache. }
        - { apiGroups: [""], resources: [secrets], verbs: [get], why: "Read the token of the VM export it created (get only). Cluster-wide because the image namespace exists only with OpenShift Virtualization, and a Role there would block installing Bare Metal without it; exports are limited to IMAGE_NAMESPACES (default openshift-virtualization-os-images) in code." }
        - { apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, list, create, delete], why: Volumes for exported images. }
        - { apiGroups: [route.openshift.io], resources: [routes], verbs: [get, list], why: Find the image-cache URL to give Ironic. }
    secrets: { access: cluster, why: "VM export tokens (get only). BMC credentials are created by the signed-in user, not by this tool." }
  versions:
    - version: "0.1.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-baremetal:0.1.1-ocp4.21
      gitRef: v0.1.1
    - version: "0.1.1"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-baremetal:0.1.1-ocp4.22
      gitRef: v0.1.1
    - version: "0.1.2"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-baremetal:0.1.2-ocp4.21
      gitRef: v0.1.2
    - version: "0.1.2"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-baremetal:0.1.2-ocp4.22
      gitRef: v0.1.2
