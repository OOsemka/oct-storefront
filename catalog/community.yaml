apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-odf-macvlans
spec:
  displayName: ODF Macvlans
  description: >-
    Move OpenShift Data Foundation (Ceph) traffic onto dedicated macvlan
    public and cluster networks. Pick a node interface, VLAN IDs and CIDRs;
    the tool configures the nodes with NMState, creates the NADs, runs the
    Multus validation test and switches the StorageCluster. Requires ODF
    4.21 or later. Community project, not officially supported by Red Hat.
  category: storage
  source: community
  git: https://github.com/OOsemka/oct-odf-macvlans
  consolePlugin: oct-odf-macvlans
  href: /community-tools/storage/odf-macvlans
  icon: tiles/oct-odf-macvlans.svg
  defaultChannel: stable
  channels:
    stable: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  versions:
    - version: "0.1.0"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/cjanisze/oct-odf-macvlans:0.1.0-ocp4.21
      gitRef: v0.1.0
    - version: "0.1.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/cjanisze/oct-odf-macvlans:0.1.0-ocp4.22
      gitRef: v0.1.0
