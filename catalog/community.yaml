apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-shift-on-shift-virt
spec:
  displayName: Shift-on-Shift Virt
  description: >-
    Deploy standalone OpenShift clusters on KubeVirt virtual machines
    (full OCP-on-OCP, not HyperShift). A wizard drives an agent-based install
    onto a per-cluster user-defined network; one bastion VM provides nested
    DNS, the Machine Config Server relay and an optional graphical desktop for
    reaching the nested console. Optionally extends a host StorageClass into
    the nested cluster (KubeVirt CSI) and installs OpenShift Virtualization
    there.
  category: compute
  source: community
  git: https://github.com/openshift-community-tools/oct-shift-on-shift-virt
  consolePlugin: oct-shift-on-shift-virt
  href: /community-tools/compute/shift-on-shift-virt
  icon: tiles/oct-shift-on-shift-virt.svg
  # Needs KubeVirt (OpenShift Virtualization) and a StorageClass that can bind
  # RWX Block volumes: nested VM root disks use them so masters stay
  # live-migratable. The wizard also asks for an external VLAN NAD plus API and
  # ingress IPs on it.
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: privileged
    summary: Deploys standalone OpenShift clusters on KubeVirt VMs, by installing them or by cloning a master cluster's disk snapshots (Express). Each nested cluster gets its own namespace, network, VMs, disks and helper services, managed by an orchestrator through the NestedCluster API.
    backend:
      services: [sos-orchestrator]
      auth: ssar
      authModeDefault: audit
      publicPaths: []
    network: { ingress: console-only, networkPolicy: true, routes: [], egress: [] }
    rbac:
      rules:
        - { apiGroups: [""], resources: [namespaces], verbs: [get, list, watch, create, delete], why: "One namespace per nested cluster; only namespaces it created are ever deleted." }
        - { apiGroups: [kubevirt.io, subresources.kubevirt.io], resources: [virtualmachines, virtualmachineinstances], verbs: [get, list, watch, create, update, patch, delete], why: The nested cluster's control-plane and worker VMs and the bastion. }
        - { apiGroups: [cdi.kubevirt.io, snapshot.storage.k8s.io, storage.k8s.io], resources: [datavolumes, volumeimportsources, storageprofiles, volumesnapshots, volumesnapshotcontents, volumesnapshotclasses, storageclasses], verbs: [get, list, watch, create, update, patch, delete], why: VM disks and the optional nested storage (KubeVirt CSI). }
        - { apiGroups: [k8s.ovn.org, k8s.cni.cncf.io], resources: [clusteruserdefinednetworks, network-attachment-definitions, ipamclaims], verbs: [get, list, watch, create, update, patch, delete], why: A user-defined network per nested cluster. }
        - { apiGroups: [security.openshift.io], resources: [securitycontextconstraints], resourceNames: [anyuid], verbs: [use], why: Helper pods (HAProxy, DNS) that run as a fixed UID. }
        - { apiGroups: [""], resources: [secrets, configmaps, services, serviceaccounts, endpoints, persistentvolumeclaims, resourcequotas], verbs: [get, list, watch, create, update, patch, delete], why: "Each nested cluster's pull secret, kubeconfig and install config, the Services for its API and ingress, and a quota for its namespace." }
        - { apiGroups: ["", apps, batch, discovery.k8s.io], resources: [pods, pods/exec, pods/log, deployments, jobs, endpointslices], verbs: [get, list, watch, create, update, patch, delete], why: "Helper deployments and install jobs; reads install logs and runs the network self-test (exec)." }
        - { apiGroups: [route.openshift.io, config.openshift.io, operator.openshift.io], resources: [routes, infrastructures, dnses, ingresscontrollers], verbs: [get, list, watch, create, update, patch, delete], why: "Optionally publishes the nested API and console, and with publishAppRoutes the nested cluster's own app routes, through host Routes; reads the host domain." }
        - { apiGroups: [rbac.authorization.k8s.io], resources: [clusterroles, clusterrolebindings, roles, rolebindings], verbs: [get, list, create, update, patch, delete], why: RBAC for components it deploys for each nested cluster (for example the KubeVirt CSI driver's access to its namespace on the host). }
        - { apiGroups: [octools.io], resources: [nestedclusters, nestedclusters/status, ippools], verbs: [get, list, watch, create, update, patch, delete], why: Its own NestedCluster API and IP pools. }
        - { apiGroups: [""], resources: [nodes, persistentvolumes], verbs: [get, list], why: Check host capacity and volume binding. }
    privileged:
      scc: [anyuid]
      hostAccess: []
      runtimeCreates:
        - { kind: Namespace, name: per nested cluster, cleanup: Deleted with the nested cluster (only namespaces it created)., why: Isolates each nested cluster. }
        - { kind: ClusterUserDefinedNetwork, name: per nested cluster, why: The nested cluster's internal network. }
