apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-baremetal
spec:
  displayName: Bare Metal Hosts
  description: >-
    Inventory Metal3 BareMetalHost nodes, register hosts from BMC Redfish, and
    deploy golden images. Register and Deploy open from the inventory.
  category: compute
  source: community
  git: https://github.com/cjanisze/oct-baremetal
  consolePlugin: oct-baremetal
  href: /baremetal/nodes
  # Bundled storefront SVG (src/assets/tiles/). Not a URL.
  icon: tiles/oct-baremetal.svg
  # Add checks Provisioning/provisioning-configuration spec.watchAllNamespaces
  # and can patch true with the user's console credentials (recommended switch).
  # Optional: spec.storageClassName pre-selects Add's StorageClass dropdown
  # for PVC image-cache (100Gi). Omit to use the cluster default.
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  versions:
    - version: "0.1.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/cjanisze/oct-baremetal:0.1.1-ocp4.21
      gitRef: v0.1.1
    - version: "0.1.1"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/cjanisze/oct-baremetal:0.1.1-ocp4.22
      gitRef: v0.1.1
---
