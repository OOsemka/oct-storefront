apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-storage-bench
spec:
  displayName: Storage Bench
  description: >-
    Benchmark storage performance with FIO-based workloads against any
    storage backend. Includes RADOS tests for Ceph clusters. Compare
    results over time. Community project, not officially supported by
    Red Hat.
  category: storage
  source: community
  git: https://github.com/openshift-community-tools/oct-storage-bench
  consolePlugin: oct-storage-bench
  href: /community-tools/storage/bench
  icon: tiles/oct-storage-bench.svg
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: privileged
    summary: Runs FIO and RADOS storage benchmarks as Jobs on the StorageClass or Ceph pool you choose, and shows the results.
    backend:
      services: [benchmark-runner]
      auth: none
      publicPaths: []
    network: { ingress: console-only, networkPolicy: false, routes: [], egress: [] }
    rbac:
      rules:
        - { apiGroups: [batch], resources: [jobs], verbs: [get, list, watch, create, delete], why: Run benchmark Jobs and clean them up. }
        - { apiGroups: [""], resources: [pods, pods/log], verbs: [get, list, watch], why: Read benchmark results from the Job logs. }
        - { apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, list, create, delete], why: Test volumes on the StorageClass being measured. }
        - { apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list], why: List StorageClasses to benchmark. }
        - { apiGroups: [""], resources: [secrets], verbs: [get, list], why: "Ceph credentials for RADOS benchmarks. Cluster-wide today; to be limited to openshift-storage." }
        - { apiGroups: [""], resources: [configmaps], verbs: [get, list, create, update, patch, delete], why: Benchmark settings and saved results. }
        - { apiGroups: [ceph.rook.io], resources: [cephblockpools, cephclusters], verbs: [get, list, create, delete], why: A temporary pool for RADOS benchmarks. }
        - { apiGroups: [ocs.openshift.io], resources: [storageclusters], verbs: [get, list], why: Detect ODF. }
    secrets: { access: cluster, why: Ceph credentials for RADOS benchmarks. }
  versions:
    - version: "0.1.2"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-storage-bench:0.1.2-ocp4.21
      gitRef: v0.1.2
    - version: "0.1.2"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-storage-bench:0.1.2-ocp4.22
      gitRef: v0.1.2
    - version: "0.1.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-storage-bench:0.1.1-ocp4.21
      gitRef: v0.1.1
    - version: "0.1.1"
      channel: stable
