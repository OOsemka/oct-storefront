apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-windows-builder
spec:
  displayName: Windows Builder
  description: >-
    Build sysprepped Windows disks for OpenShift Virtualization. Creates CDI
    DataVolumes from an ISO you provide (names match template DATA_SOURCE_NAME).
    No Tekton. Community project, not officially supported by Red Hat.
  category: compute
  source: community
  git: https://github.com/openshift-community-tools/oct-windows-builder
  consolePlugin: oct-windows-builder
  href: /community-tools/compute/windows-builder
  # Bundled storefront SVG (src/assets/tiles/). Original paperclip assistant, not Microsoft Clippy art.
  icon: tiles/oct-windows-builder.svg
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: cluster-write
    summary: Builds sysprepped Windows golden disks for OpenShift Virtualization from an ISO you provide, in the namespace you choose, and points the matching Template at the result.
    backend:
      services: [windows-builder]
      auth: none
      publicPaths: []
    network: { ingress: console-only, networkPolicy: false, routes: [], egress: [] }
    rbac:
      rules:
        - { apiGroups: [cdi.kubevirt.io], resources: [datavolumes, datasources, datavolumes/source], verbs: [get, list, watch, create, update, patch, delete], why: Import the ISO and publish the finished disk as a DataSource. }
        - { apiGroups: [kubevirt.io], resources: [virtualmachines, virtualmachineinstances], verbs: [get, list, watch, create, update, patch, delete], why: The temporary VM that installs and sysprepps Windows. }
        - { apiGroups: [template.openshift.io], resources: [templates], verbs: [get, list, watch, create, update, patch], why: Point the matching Windows Template at the new DataSource. }
        - { apiGroups: [""], resources: [configmaps, persistentvolumeclaims], verbs: [get, list, watch, create, update, patch, delete], why: Build scripts and disks in the namespace you choose. }
        - { apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list], why: Choose the StorageClass for the disk. }
        - { apiGroups: [batch], resources: [jobs], verbs: [get, list, watch, create, delete], why: Builder Jobs in its own namespace. }
        - { apiGroups: [""], resources: [pods, pods/log], verbs: [get, list], why: Build progress from the builder pods' logs (its own namespace). }
    secrets: { access: none }
  versions:
