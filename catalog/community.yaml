  # Bundled storefront SVG (src/assets/tiles/). Not a URL.
  icon: tiles/oct-network-bond.svg
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  versions:
    - version: "1.0.0"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/cjanisze/oct-network-bond:1.0.0-ocp4.21
