apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-network-bond
spec:
  displayName: Network Bond
  description: >-
    Bond physical NICs by MachineConfigPool. Pools that share the same NIC names
    can be selected together. Creates NodeNetworkConfigurationPolicy resources.
  category: network
  source: community
  git: https://github.com/openshift-community-tools/oct-network-bond
  consolePlugin: oct-network-bond
  href: /community-tools/network/bond
  # Bundled storefront SVG (src/assets/tiles/). Not a URL.
  icon: tiles/oct-network-bond.svg
  defaultChannel: stable
  channels:
    stable: {}
    candidate: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: plugin
    summary: Browser-only. Creates NodeNetworkConfigurationPolicies (node bonds) with your own permissions; can install the NMState operator if it is missing.
    network: { ingress: console-only, networkPolicy: true }
    privileged:
      scc: []
      hostAccess: []
      runtimeCreates:
        - { kind: NodeNetworkConfigurationPolicy, name: per bond, cleanup: Deleted from the page., why: Changes node networking (cluster-scoped); created with your permissions. }
        - { kind: Subscription, name: kubernetes-nmstate-operator, why: Installs the NMState operator when it is missing. }
    secrets: { access: none }
  versions:
    - version: "0.1.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-network-bond:0.1.1-ocp4.21
      gitRef: v0.1.1
