apiVersion: communitytools.io/v1alpha1
kind: CommunityTool
metadata:
  name: oct-odf-macvlans
spec:
  displayName: ODF Macvlans
  description: >-
    Move OpenShift Data Foundation (Ceph) traffic onto dedicated macvlan
    public and cluster networks. Pick a node interface, VLAN IDs and CIDRs;
    the tool configures the nodes with NMState, creates the NADs, runs the
    Multus validation test and switches the StorageCluster. Requires ODF
    4.21 or later. Community project, not officially supported by Red Hat.
  category: storage
  source: community
  git: https://github.com/openshift-community-tools/oct-odf-macvlans
  consolePlugin: oct-odf-macvlans
  href: /community-tools/storage/odf-macvlans
  icon: tiles/oct-odf-macvlans.svg
  defaultChannel: stable
  channels:
    stable: {}
  validatedOn:
    - "4.21"
    - "4.22"
  minOpenShift: "4.21"
  security:
    schema: 1
    level: plugin
    summary: Browser-only. Moves ODF traffic to dedicated networks with your own permissions; patches the StorageCluster network settings and creates NodeNetworkConfigurationPolicies and a validation Job.
    network: { ingress: console-only, networkPolicy: true }
    privileged:
      scc: []
      hostAccess: []
      runtimeCreates:
        - { kind: NodeNetworkConfigurationPolicy, name: per network, why: Node interfaces for the storage networks (cluster-scoped); created with your permissions. }
        - { kind: Role, name: validation grant in openshift-storage, why: Lets Rook's network validation Job run; created with your permissions. }
    secrets: { access: none }
  versions:
    - version: "0.1.0"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-odf-macvlans:0.1.0-ocp4.21
      gitRef: v0.1.0
    - version: "0.1.0"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-odf-macvlans:0.1.0-ocp4.22
      gitRef: v0.1.0
    - version: "0.1.1"
      channel: stable
      openshift: ["4.21"]
      image: quay.io/openshift-community-tools/oct-odf-macvlans:0.1.1-ocp4.21
      gitRef: v0.1.1
    - version: "0.1.1"
      channel: stable
      openshift: ["4.22"]
      image: quay.io/openshift-community-tools/oct-odf-macvlans:0.1.1-ocp4.22
      gitRef: v0.1.1
